<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aide & Support - Meet Me</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.2/axios.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-10 border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-purple-100 rounded-3xl flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Aide & Support</h1>
            <p class="text-gray-500 mt-2">Dites-nous comment nous pouvons vous aider.</p>
        </div>

        <form id="support-form" class="space-y-5">
            <div>
                <label class="text-xs font-bold text-gray-400 uppercase mb-2 block tracking-widest">Votre Email</label>
                <input type="email" id="email" required class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-purple-500 outline-none transition-all">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-400 uppercase mb-2 block tracking-widest">Catégorie</label>
                <select id="category" class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none">
                    <option value="other">Autre question</option>
                    <option value="connection">Problème de connexion</option>
                    <option value="bug">Signaler un bug</option>
                    <option value="account">Gestion du compte</option>
                </select>
            </div>
            <div>
                <label class="text-xs font-bold text-gray-400 uppercase mb-2 block tracking-widest">Votre message</label>
                <textarea id="reason" rows="4" required class="w-full px-5 py-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none" placeholder="Décrivez votre problème..."></textarea>
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-purple-600 text-white py-4 rounded-2xl font-bold shadow-xl shadow-purple-100 hover:bg-purple-700 transition-all active:scale-95">ENVOYER LA DEMANDE</button>
        </form>

        <div id="success-msg" class="hidden text-center p-6 bg-green-50 rounded-3xl border border-green-100 animate-fade-in">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-green-500 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p class="text-green-800 font-bold text-lg">Demande envoyée !</p>
            <p class="text-green-600 text-sm mt-1">Notre équipe vous répondra par e-mail dans les plus brefs délais.</p>
        </div>

        <div class="mt-8 text-center">
            <a href="/privacy" class="text-xs text-purple-600 font-bold hover:underline">Politique de Confidentialité</a>
        </div>
    </div>

    <script>
        document.getElementById('support-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const form = document.getElementById('support-form');
            const success = document.getElementById('success-msg');

            const data = {
                email: document.getElementById('email').value,
                category: document.getElementById('category').value,
                reason: document.getElementById('reason').value
            };

            try {
                btn.disabled = true;
                btn.innerText = 'ENVOI EN COURS...';

                await axios.post('/api/support/helpdesk', data);

                form.classList.add('hidden');
                success.classList.remove('hidden');
            } catch (err) {
                alert('Erreur lors de l\'envoi. Veuillez réessayer.');
                btn.disabled = false;
                btn.innerText = 'ENVOYER LA DEMANDE';
            }
        });
    </script>
</body>
</html>
